<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coordinates board</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap">
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml">
  <script src="js/theme.js?v=37"></script>
  <link rel="stylesheet" href="style.css?v=85">
</head>
<body class="marks">
  <nav id="nav">
    <a id="testlink" href="test-board.html" aria-label="test board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.5a1 1 0 0 0 .9 1.5h12.8a1 1 0 0 0 .9-1.5l-5.1-10.1a2 2 0 0 1-.2-.9V2M8.5 2h7M7 16h10"/></svg>
    </a>
    <a id="home" href="index.html" aria-label="all openings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
    </a>
  </nav>
  <button id="theme-toggle" type="button" aria-label="switch to dark mode"></button>
  <main class="tester coords">
    <div class="wrap">
      <div id="stage"></div>
      <div class="tools">
        <button id="flip" type="button" aria-label="flip the board">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/></svg>
        </button>
        <button id="mode" type="button" aria-label="click the squares instead">
          <svg class="to-click" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.12 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.12a.5.5 0 0 1-.95.06z"/></svg>
          <svg class="to-type" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        </button>
        <button id="study-toggle" type="button" aria-label="hide the coordinates" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
        </button>
      </div>
    </div>
    <div class="lower">
      <input id="san" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="type the square, e.g. e4" autofocus>
      <div id="files" hidden>
        <div class="row" data-group="files"><span class="what">files</span><label><input type="checkbox" data-group="files" value="a" checked> a</label><label><input type="checkbox" data-group="files" value="b" checked> b</label><label><input type="checkbox" data-group="files" value="c" checked> c</label><label><input type="checkbox" data-group="files" value="d" checked> d</label><label><input type="checkbox" data-group="files" value="e" checked> e</label><label><input type="checkbox" data-group="files" value="f" checked> f</label><label><input type="checkbox" data-group="files" value="g" checked> g</label><label><input type="checkbox" data-group="files" value="h" checked> h</label><button type="button" data-set="all">all</button><button type="button" data-set="none">none</button></div>
        <div class="row" data-group="ranks"><span class="what">ranks</span><label><input type="checkbox" data-group="ranks" value="1" checked> 1</label><label><input type="checkbox" data-group="ranks" value="2" checked> 2</label><label><input type="checkbox" data-group="ranks" value="3" checked> 3</label><label><input type="checkbox" data-group="ranks" value="4" checked> 4</label><label><input type="checkbox" data-group="ranks" value="5" checked> 5</label><label><input type="checkbox" data-group="ranks" value="6" checked> 6</label><label><input type="checkbox" data-group="ranks" value="7" checked> 7</label><label><input type="checkbox" data-group="ranks" value="8" checked> 8</label><button type="button" data-set="all">all</button><button type="button" data-set="none">none</button></div>
      </div>
    </div>
  </main>
  <script type="module" src="js/coordinates.js?v=7"></script>
</body>
</html>
