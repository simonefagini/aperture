<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test board</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap">
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml">
  <script src="js/theme.js?v=37"></script>
  <link rel="stylesheet" href="style.css?v=81">
</head>
<body class="marks">
  <nav id="nav">
    <a id="coordlink" href="coordinates.html" aria-label="coordinates board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
    </a>
    <a id="home" href="index.html" aria-label="all openings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
    </a>
  </nav>
  <button id="theme-toggle" type="button" aria-label="switch to dark mode"></button>
  <main class="tester">
    <div class="wrap">
      <div id="stage"></div>
      <div class="tools">
        <button id="flip" type="button" aria-label="flip the board">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/></svg>
        </button>
        <button id="study-toggle" type="button" aria-label="study mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
        </button>
        <button id="open" type="button" aria-label="open on chess.com analysis">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </button>
      </div>
    </div>
    <div class="lower">
      <input id="san" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
             placeholder="1. d4 d5 2. Bf4! c5 {[%cal Rc5d4,Gf3e5L][%csl Yc3][%sqr Re8]}" autofocus>
      <div id="debug" hidden></div>
    </div>
  </main>
  <script type="module" src="js/test-board.js?v=14"></script>
</body>
</html>
