<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>board recognition</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap">
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml">
  <script src="js/theme.js?v=38"></script>
  <link rel="stylesheet" href="style.css?v=95">
  <link rel="stylesheet" href="ocr.css?v=21">
</head>
<body>
  <nav id="nav">
    <a id="testlink" href="test-board.html" aria-label="test board" title="test board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.5a1 1 0 0 0 .9 1.5h12.8a1 1 0 0 0 .9-1.5l-5.1-10.1a2 2 0 0 1-.2-.9V2M8.5 2h7M7 16h10"/></svg>
    </a>
    <a id="coordlink" href="coordinates.html" aria-label="coordinates board" title="coordinates board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
    </a>
    <a id="ocrlink" href="ocr.html" aria-label="board recognition" title="board recognition" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>
    </a>
    <a id="home" href="index.html" aria-label="all openings" title="all openings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
    </a>
  </nav>
  <button id="theme-toggle" type="button" aria-label="switch to dark mode"></button>
  <main class="ocr">
    <input id="file" type="file" accept="image/*" hidden>
    <div class="wrap">
      <label id="stage" class="empty" for="file" tabindex="0" aria-label="choose a screenshot, or drop or paste one"></label>
      <div class="tools" id="tools" hidden>
        <button id="flip" type="button" aria-label="flip the board">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/></svg>
        </button>
        <button id="original" type="button" aria-label="show the screenshot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
        </button>
        <button id="open" type="button" aria-label="open on chess.com analysis">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </button>
        <button id="clear" type="button" aria-label="clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="under">
        <p id="status" aria-live="polite"></p>
        <div id="result" hidden>
          <div class="opts">
            <button id="turn" class="turn" type="button" aria-label="side to move: click to switch">
          <span id="turnText">white to move</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/></svg>
        </button>
        <div class="castle" aria-label="castling rights">
              <span class="lbl">castling</span>
              <label><input type="checkbox" value="K"><span>K</span></label>
              <label><input type="checkbox" value="Q"><span>Q</span></label>
              <label><input type="checkbox" value="k"><span>k</span></label>
              <label><input type="checkbox" value="q"><span>q</span></label>
            </div>
          </div>
          <div class="fenrow">
          <input id="fen" type="text" readonly spellcheck="false" aria-label="fen">
          <button id="copy" type="button" aria-label="copy the fen">
            <svg class="i-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
            <svg class="i-done" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
          </button>
        </div>
        </div>
    </div>
    <footer>Your screenshot stays in your browser, nothing is uploaded.<br>The model was trained with PyTorch on boards drawn from freely licensed Lichess piece sets: <a href="https://github.com/simonefagini/aperture/blob/main/LICENSES.md#board-recognition-model-modelbaselineonnx" target="_blank" rel="noopener">details</a>.</footer>
  </main>
  <dialog id="shotbox" aria-label="the screenshot, with the board found outlined">
    <canvas id="shot"></canvas>
  </dialog>
  <script type="module" src="js/ocr.js?v=12"></script>
</body>
</html>
